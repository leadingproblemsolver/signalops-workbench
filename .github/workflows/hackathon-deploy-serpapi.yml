name: hackathon-deploy-serpapi

on:
  workflow_dispatch:
    inputs:
      region:
        description: Cloud Run region
        required: false
        default: me-central1
      service:
        description: Cloud Run service name
        required: false
        default: signalops-serpapi-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve project and enable services
        id: gcp
        shell: bash
        run: |
          PROJECT_ID="$(gcloud config get-value project)"
          test -n "$PROJECT_ID" && test "$PROJECT_ID" != "(unset)"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com

      - name: Prepare hackathon container source
        run: cp Dockerfile.hackathon Dockerfile

      - name: Build container in Cloud Build
        shell: bash
        run: |
          IMAGE="gcr.io/${{ steps.gcp.outputs.project_id }}/${{ inputs.service }}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud builds submit --tag "$IMAGE" .

      - name: Deploy public Cloud Run service
        shell: bash
        run: |
          gcloud run deploy '${{ inputs.service }}' \
            --image "$IMAGE" \
            --region '${{ inputs.region }}' \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Verify public service and emit receipt
        shell: bash
        run: |
          URL="$(gcloud run services describe '${{ inputs.service }}' --region '${{ inputs.region }}' --format='value(status.url)')"
          test -n "$URL"
          STATUS="$(curl --silent --show-error --output /tmp/body.txt --write-out '%{http_code}' "$URL" || true)"
          cat /tmp/body.txt || true
          test "$STATUS" -ge 200 && test "$STATUS" -lt 500
          mkdir -p artifacts/deploy
          python - <<PY
          import json, os
          receipt = {
              'receipt_version': 1,
              'commit_sha': os.environ['GITHUB_SHA'],
              'service': '${{ inputs.service }}',
              'region': '${{ inputs.region }}',
              'public_url': '$URL',
              'http_status': int('$STATUS'),
              'image': os.environ['IMAGE'],
              'claim_boundary': 'Proves public Cloud Run deployment at this commit; does not prove live SerpApi/OpenAI credentials or judge outcome.'
          }
          open('artifacts/deploy/serpapi-cloud-run.json','w',encoding='utf-8').write(json.dumps(receipt, indent=2)+'\n')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: serpapi-cloud-run-${{ github.sha }}
          path: artifacts/deploy/serpapi-cloud-run.json
          if-no-files-found: error
