name: hackathon-live-serpapi-receipt

on:
  workflow_dispatch:
    inputs:
      query:
        description: Live market query
        required: false
        default: AI agent production reliability hiring OR looking for help
      limit:
        description: Number of organic results to accept
        required: false
        default: '3'

jobs:
  live-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require live credentials
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$SERPAPI_API_KEY" || (echo 'SERPAPI_API_KEY repository secret is required' && exit 1)
          test -n "$OPENAI_API_KEY" || (echo 'OPENAI_API_KEY repository secret is required' && exit 1)
      - name: Install SignalOps
        run: python -m pip install -e .
      - name: Run credentialed hackathon acceptance path
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          SIGNALOPS_DB: artifacts/live/hackathon-live.db
        run: |
          python scripts/hackathon_live_smoke.py \
            --query '${{ inputs.query }}' \
            --limit '${{ inputs.limit }}' \
            --output artifacts/live/serpapi_hackathon_receipt.json
      - name: Upload sanitized live receipt
        uses: actions/upload-artifact@v4
        with:
          name: serpapi-live-${{ github.sha }}
          path: artifacts/live/serpapi_hackathon_receipt.json
          if-no-files-found: error
