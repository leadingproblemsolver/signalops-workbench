name: Reusable Semgrep Baseline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan caller repository
        run: semgrep scan --config auto --error .
