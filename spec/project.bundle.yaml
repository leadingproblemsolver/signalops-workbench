project_identity:
  id: signalops_workbench
  name: SignalOps Workbench
  repository: signalops-workbench
  package: signalops-workbench
  python_module: signalops
  cli: signalops
  version: 0.1.0
  current_stage: installable_vertical_slice
  project_type:
  - developer_tooling
  - evidence_operations
  - workflow_policy_engine
  - market_validation_infrastructure
  one_liner: A policy-driven workbench that converts channel-native public evidence into durable decisions, handoffs,
    and qualified next actions.
  system_thesis: Channels require distinct norms, but evidence, decision history, and continuation state must remain
    unified.
  primary_users:
  - technical founders
  - developer-tooling researchers
  - product discovery operators
  - engineering teams validating workflow problems
  primary_use_cases:
  - configure one target project
  - preserve channel-specific rules
  - ingest evidence-bearing surfaces
  - score relevance and actionability deterministically
  - enforce public/private permission boundaries
  - render restartable channel briefs
  - produce session handoffs and CRM exports
  direct_project_benefit:
    improves_core_user_result: true
    removes_current_blocker: true
    reduces_operational_risk: true
    creates_external_proof: true
    accelerates_validation: true
    creates_reusable_infrastructure: true
    explanation: The repository operationalizes the supplied command-center, separate-channel, shared-CRM, and handoff
      structure without binding the engine to incident response.
  example_domain:
    name: TraceCrumb
    role: complete configuration and playbook example
    framework_dependency: false
    incident_relevance: example_content_only
  source_artifacts:
  - docs/reference/structure-context.md
  - examples/tracecrumb/project.json
  - examples/tracecrumb/channels/
  - examples/tracecrumb/playbooks/
  - examples/generic/
problem_and_value:
  surface_problem: Project evidence, outreach decisions, and follow-up state become fragmented across channels and
    sessions.
  hidden_engineering_problem: Support heterogeneous channel policies over shared durable evidence while preserving
    provenance, permission, idempotency, decision traceability, and resumable handoffs.
  failure_if_unsolved:
  - channel norms collapse into generic messaging
  - the same surface is logged repeatedly
  - exact user language is replaced by interpretation
  - weak interest is mistaken for strong evidence
  - private contact occurs without permission
  - each session restarts without accumulated state
  - project decisions cannot be traced to observed evidence
  why_difficult:
  - concern: heterogeneous_policy
    difficulty: Each channel has distinct norms, thresholds, and acceptable next actions.
  - concern: shared_state
    difficulty: Channel separation must not fragment project truth or CRM continuity.
  - concern: provenance
    difficulty: Exact language, source URL, interpretation, and action must remain distinguishable.
  - concern: permission
    difficulty: A high score must not bypass channel-specific consent requirements.
  - concern: idempotency
    difficulty: Repeated processing should update one surface rather than inflate evidence.
  - concern: evaluation
    difficulty: Action thresholds must eventually be calibrated against later outcomes, not intuition.
  value_created:
    immediate:
    - one shared source of truth
    - channel-native decision rules
    - reproducible handoffs
    - ranked next actions
    reusable:
    - generic project schema
    - policy schema
    - surface evidence model
    - decision engine
    - brief and handoff renderer
    portfolio:
    - workflow architecture
    - policy engines
    - provenance
    - human factors
    - privacy boundaries
    - measurement discipline
  explicit_non_goals:
  - web scraping
  - account automation
  - mass outreach
  - automatic message sending
  - private-data inference
  - generic copy generation
  - autonomous product decisions
  - incident intelligence as a required module
  scope_boundary:
    in_scope:
    - local project and channel configuration
    - manual evidence-bearing surface ingestion
    - deterministic score and action selection
    - permission-aware escalation
    - brief, handoff, and CRM output
    - TraceCrumb and generic examples
    out_of_scope_until_evidence:
    - remote connectors
    - email or social account actions
    - multi-user authorization
    - automatic outcome tracking
    - model-generated responses
    - cross-project analytics
system_architecture:
  architecture_style: modular_monolith
  deployment_mode: local_first_cli
  authoritative_path:
  - project_configuration
  - channel_policy
  - evidence_surface
  - deterministic_scoring
  - policy_and_permission_gate
  - sqlite_transaction
  - surface_projection
  - decision_event
  output_path:
  - shared_project_state
  - ranked_next_actions
  - channel_execution_brief
  - session_handoff
  - crm_csv
  source_of_truth:
    project: SQLite projects table
    channel_policies: SQLite policies table
    surface_current_state: SQLite surfaces table
    decision_history: SQLite events table
    configuration_sources: project and channel JSON files
  consistency_model:
    local_writes: ACID transaction
    duplicate_surface_behavior: upsert by stable external_id
    decision_and_surface_update: same transaction
    remote_consistency: not implemented
  technology:
    language: Python 3.11+
    database: SQLite
    packaging: setuptools via pyproject.toml
    testing: unittest
    ci: GitHub Actions
    external_runtime_dependencies: []
  components:
  - name: domain_models
    path: src/signalops/models.py
    responsibility: project, policy, and surface contracts
    status: implemented
  - name: decision_engine
    path: src/signalops/scoring.py
    responsibility: composite score, permission gates, explainable action decision
    status: implemented
  - name: application_engine
    path: src/signalops/engine.py
    responsibility: stable external ID and processing orchestration
    status: implemented
  - name: persistence_store
    path: src/signalops/store.py
    responsibility: transactions, idempotent upsert, project/policy state, events
    status: implemented
  - name: rendering
    path: src/signalops/render.py
    responsibility: channel brief, handoff, and CSV output
    status: implemented
  - name: cli
    path: src/signalops/cli.py
    responsibility: operator interface and composition root
    status: implemented
  deferred_architecture:
  - capability: PostgreSQL
    trigger: shared remote operation or concurrent team members
    status: deferred
  - capability: connector_workers
    trigger: manual import becomes the dominant bottleneck and platform terms permit automation
    status: deferred
  - capability: generative_response_assistance
    trigger: evidence and policy record exist before generation and evaluation is defined
    status: deferred
  - capability: multi_project_portfolio_analytics
    trigger: several projects produce enough comparable outcome data
    status: deferred
state_contracts_and_invariants:
  entities:
    project:
      fields:
      - project_id
      - name
      - current_stage
      - core_problem
      - target_users
      - strong_evidence
      - non_goals
      - evidence_ladder
    policy:
      fields:
      - channel
      - purpose
      - tone
      - allowed
      - forbidden
      - strong_signals
      - weak_signals
      - reply_threshold
      - dm_threshold
      - call_threshold
      - dm_requires_response
      - output_sections
    surface:
      fields:
      - external_id
      - channel
      - title
      - url
      - who
      - pain
      - exact_language
      - relevance
      - urgency
      - conversation
      - responded
    decision:
      fields:
      - action
      - score
      - reason
      - trace
    event:
      fields:
      - id
      - entity_id
      - type
      - payload
      - occurred_at
      event_types:
      - project_configured
      - policy_configured
      - surface_scored
  action_model:
    actions:
    - ignore
    - save
    - public_reply
    - dm
    - call
    composite_score:
      formula: 0.50 * relevance + 0.30 * conversation + 0.20 * urgency
      range: 0..10
      reasoning: Relevance dominates because activity on the wrong problem surface remains waste.
    decision_order:
    - ignore when relevance < 4
    - call when score >= call_threshold and prior response exists
    - dm when score >= dm_threshold and policy permission allows it
    - public_reply when DM threshold is met but response permission is absent
    - public_reply when score >= reply_threshold
    - save otherwise
  hard_invariants:
  - id: exact_language_required
    rule: Every surface must preserve exact observed language separately from interpretation.
    enforcement: surface validation
    status: implemented
  - id: configured_channel_required
    rule: A surface cannot be processed without a stored channel policy.
    enforcement: policy lookup
    status: implemented
  - id: score_range
    rule: Relevance, urgency, and conversation scores remain within 0..10.
    enforcement: surface validation
    status: implemented
  - id: permission_gate
    rule: When a policy requires a response, a high score cannot directly produce DM or call.
    enforcement: deterministic decision order
    status: implemented
  - id: idempotent_surface
    rule: The same external_id updates one current surface projection.
    enforcement: SQLite primary key upsert
    status: implemented
  - id: no_automated_account_action
    rule: The runtime produces recommendations and files only.
    enforcement: no sending or connector module exists
    status: implemented
  evidence_strength_model:
    default_ladder:
    - attention
    - reply
    - qualified_conversation
    - environment_access
    - deployment
    - repeat_usage
    - internal_champion
    - procurement_activity
    - payment
    - expansion_or_referral
    rule: Lower evidence must not be represented as equivalent to later behavioral or economic commitment.
    status: documented
  known_semantic_limitations:
  - limitation: thresholds_not_calibrated
    meaning: Current thresholds are explicit defaults, not learned outcome-optimal policies.
    status: documented
  - limitation: surface_status_static
    meaning: The current status remains queued; full action/outcome lifecycle is not implemented.
    status: documented
  - limitation: event_policy_version_absent
    meaning: Decision events do not yet persist the complete policy version used.
    status: documented
workflows_interfaces_and_repository:
  primary_operator_workflow:
  - step: 1
    command: signalops init --project <project.json> --channels <channel-directory> --db <path>
    result: project and all channel policies persisted
  - step: 2
    command: signalops add-surface --channel <channel> --title <title> --url <url> --pain <text> --exact-language
      <quote> --relevance <0..10> --urgency <0..10> --conversation <0..10> [--responded]
    result: idempotent surface projection and explainable decision event
  - step: 3
    command: signalops next-actions [--channel <channel>] [--limit <n>]
    result: ranked action queue
  - step: 4
    command: signalops render-brief --channel <channel> [--output <file>]
    result: restartable channel-native operating brief
  - step: 5
    command: signalops handoff --channel <channel> --output <file>
    result: session evidence, exact language, decisions, questions, and continuation point
  - step: 6
    command: signalops export-crm --output <file.csv>
    result: portable shared CRM export
  generic_project_application:
  - copy examples/generic
  - replace project identity and core problem
  - define exact target users
  - define evidence ladder and non-goals
  - create one policy per actual surface
  - set conservative reply, DM, and call thresholds
  - run manual evidence-bearing surfaces through the CLI
  - change thresholds only after outcome data exists
  tracecrumb_example_structure:
    project: examples/tracecrumb/project.json
    policies: examples/tracecrumb/channels/*.json
    playbooks: examples/tracecrumb/playbooks/*.md
    purpose: demonstrate a complete domain application
    framework_dependency: false
  install_and_validation:
    install: python -m pip install -e .
    test: python -m unittest discover -s tests -v
    smoke: python scripts/smoke_test.py
    make_targets:
    - make install
    - make test
    - make smoke
    - make clean
  repository_map:
  - path: src/signalops/
    purpose: runtime modules
  - path: examples/generic/
    purpose: domain-neutral starter
  - path: examples/tracecrumb/
    purpose: complete supplied application
  - path: tests/
    purpose: policy, permission, and idempotency tests
  - path: docs/
    purpose: RFC, architecture, evaluation, threats, failures, ADRs
  - path: scripts/
    purpose: reproducible smoke proof
  - path: .github/
    purpose: CI and contribution workflow
  - path: spec/
    purpose: canonical segmented YAML project specification
  github_presentation:
    default_branch: main
    recommended_topics:
    - developer-tools
    - workflow-engine
    - product-discovery
    - policy-engine
    - evidence
    - sqlite
    - local-first
    - human-in-the-loop
    read_order:
    - README.md
    - spec/00_project_identity.yaml
    - docs/EMPLOYER_GUIDE.md
    - docs/RFC.md
    - src/signalops/scoring.py
    - src/signalops/store.py
    - tests/test_signalops.py
